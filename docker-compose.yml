services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    command: python manage.py runserver 0.0.0.0:8000

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server